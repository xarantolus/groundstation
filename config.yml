    iq_upload: never


  - name: CATSAT
    norad: 60246
    tags: [AX100]
    frequency: 437.185e6
    bandwidth: 80e3
    gain: 30
    sample_rate: 96e3
    lo_offset: 100e3
    # Temporary AX100 Mode 5 debugging: always record, keep IQ at 96 kS/s.
    priority: 7
    iq_upload: always
    decoder:
      - name: waterfall
        role: waterfall
        container: ghcr.io/xarantolus/groundstation/waterfall:latest
      - name: ax100
        container: ghcr.io/xarantolus/groundstation/ax100-decoder:latest
        min_size_bytes: 1
        env:
          # 96 kS/s fits at most 32000 baud (filter cutoff 1.5 x baud < 48 kHz).
          BAUD_RATE: [1200, 2400, 4800, 9600, 19200]
          # Narrow FSK (gr-satellites: 750 Hz at 2k4); the 0.75*baud default
          # loses its packets.
          DEVIATION: 750
