nas_directory: /mnt/nas

pass_elevation_threshold_deg: 10
pass_start_threshold: 5
update_interval_hours: 24
# Always record satellites with priority >= 7 (FramSat-1,
# ASRTU-1, Meteor); skip lower-priority passes while more than
# skip_decoder_backlog decoder runs are waiting, so the backlog can drain.
always_record_priority: 7
skip_decoder_backlog: 10
# Upload the IQ recording of any pass where one decoder produced 50+ files
# (e.g. many packets), so it can be re-decoded later.
iq_upload_min_outputs: 50
# Golden passes for decoder development: the IQ of AX100 passes with many
# packets, few packets for the signal bursts seen, or signal but no packets
# goes to <nas>/golden/<category>/ (up to max_per_satellite each).
golden:
  tags: [AX100]
  min_packets: 50
  min_bursts: 10
  few_packets_ratio: 0.3
  max_per_satellite: 20
