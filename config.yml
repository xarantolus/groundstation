    norad: 100610
    frequency: 435.141e6
    bandwidth: 48e3
    sample_rate: 384e3
    lo_offset: 100e3
    gain: 30
    priority: 60
    iq_upload: never
    decoder:
      - name: waterfall
        role: waterfall
        container: ghcr.io/xarantolus/groundstation/waterfall:latest


  - name: ASRTU-1
    norad: 61781
    frequency: 435.400e6
