  # Image-producing satellites (SatDump pipelines)
  - name: RTU-MIREA1
    norad: 61785
    frequency: 436.200e6
    bandwidth: 128e3
    gain: 40
    sample_rate: 384e3
    lo_offset: 100e3
    priority: 2
    iq_upload: never
