  # Image-producing satellites (SatDump pipelines)
  - name: RTU-MIREA1
    norad: 61785
    frequency: 436.200e6
    bandwidth: 128e3
    gain: 40
    sample_rate: 384e3
    lo_offset: 100e3
    priority: 2
    iq_upload: never
    decoder:
      - name: waterfall
        role: waterfall
        container: ghcr.io/xarantolus/groundstation/waterfall:latest
      - name: geoscan
        container: ghcr.io/xarantolus/groundstation/satdump-decoder:latest
        min_size_bytes: 1
        # The recording is already doppler-corrected; SatDump's own correction
        # also needs TLEs, which its settings deliberately never download.
        args: --enable_doppler=false
        env:
          PIPELINE_NAME: rtumirea1_uhf
    gain: 30

