satellites:
  - name: SpaceTeamSat-1
    # Elements from the SatNOGS DB (Space-Track analyst object 99416, not on
    # CelesTrak): STS1 flies within km of FramSat-1 and CelesTrak's labels for
    # 2026-203A/B are still being refitted. norad is the CelesTrak fallback.
    satnogs_id: GCRL-7329-1908-5510-3384
    norad: 100609
    frequency: 437.395e6
    # Wide passband (file size is set by sample_rate) to catch a transmitter
    # off its nominal frequency; stays clear of the DC spike at -lo_offset.
    bandwidth: 150e3
    sample_rate: 384e3
    lo_offset: 100e3
    gain: 30
    priority: 61
    iq_upload: always
    decoder:
      - name: waterfall
        role: waterfall
        container: ghcr.io/xarantolus/groundstation/waterfall:latest

  - name: FramSat-1
    norad: 100610
    frequency: 435.141e6
    bandwidth: 48e3
    sample_rate: 384e3
    lo_offset: 100e3
    gain: 30
    priority: 60
    iq_upload: never
    decoder:
      - name: waterfall
        role: waterfall
        container: ghcr.io/xarantolus/groundstation/waterfall:latest


  - name: ASRTU-1
    norad: 61781
    frequency: 435.400e6
    bandwidth: 24e3
    sample_rate: 96e3
    lo_offset: 20e3
    gain: 30
    priority: 15
    iq_upload: never
    decoder:
      - name: waterfall
        role: waterfall
        container: ghcr.io/xarantolus/groundstation/waterfall:latest
      - name: lrpt
        container: ghcr.io/xarantolus/groundstation/gr-satellites:latest
        env:
          SATELLITE: ASRTU-1
          SAMP_RATE: 96000

  - name: Meteor M2-3
    norad: 57166
    frequency: 137.900e6
    # Recorder filter is flat to ~0.4*bandwidth: 180 kHz keeps the 80k LRPT
    # mode (+-64 kHz) unattenuated and the DC spike at -lo_offset outside.
    bandwidth: 180e3
    sample_rate: 384e3
    lo_offset: 100e3
    gain: 30
    priority: 7
    decoder:
      - name: waterfall
        role: waterfall
        container: ghcr.io/xarantolus/groundstation/waterfall:latest
      - name: lrpt
        container: ghcr.io/xarantolus/groundstation/satdump-decoder:latest
        args: --satellite_number=M2-3 --fill_missing
        env:
          PIPELINE_NAME: meteor_m2_lrpt
        min_files: 6
      - name: x_lrpt
        container: ghcr.io/xarantolus/groundstation/satdump-decoder:latest
        args: --satellite_number=M2-3 --fill_missing
        env:
          PIPELINE_NAME: meteor_m2-x_lrpt
        min_files: 6
      - name: x_lrpt_80k
        container: ghcr.io/xarantolus/groundstation/satdump-decoder:latest
        args: --satellite_number=M2-3 --fill_missing
        env:
          PIPELINE_NAME: meteor_m2-x_lrpt_80k
        min_files: 6
        timeout_minutes: 2
    iq_upload: never


  - name: Meteor M2-4
    norad: 59051
    frequency: 137.900e6
    # Recorder filter is flat to ~0.4*bandwidth: 180 kHz keeps the 80k LRPT
    # mode (+-64 kHz) unattenuated and the DC spike at -lo_offset outside.
    bandwidth: 180e3
